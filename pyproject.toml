[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dat-parkinsons-ml"
version = "0.1.0"
description = "Learned slice selection, multi-view DaT imaging, and probability ensembles"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ivan Triandofilidi"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2", "opencv-python-headless>=4.9,<5",
  "nibabel>=5.2,<6", "torchio>=0.19,<1", "torch>=2.4,<3",
  "torchvision>=0.19,<1", "timm>=1.0,<2", "Pillow>=10,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
dat-parkinsons = "dat_parkinsons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
