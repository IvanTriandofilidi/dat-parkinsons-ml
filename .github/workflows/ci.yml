name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Test contracts and numerical edge cases
        run: pytest -q
      - name: Synthetic end-to-end inference
        run: dat-parkinsons demo --output runs/ci-demo
      - name: Build distribution
        run: python -m build
